<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鬼画符解码器 · 手写批量识别</title>
<meta name="description" content="手写图片批量识别：只抓手写内容和它前面的标签，一条一行带复制键；也能整页转写。最多 10 张打包成一次 Gemini 请求。">
<meta name="theme-color" content="#1c1917">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.14.0/dist/html2pdf.bundle.min.js"></script>
<style>
  html { -webkit-text-size-adjust: 100%; }
  [hidden] { display: none !important; }
  .masked { -webkit-text-security: disc; }
  .drop-hot { border-color: #b91c1c !important; background: rgba(185, 28, 28, .06); }
  .spin { width: 1em; height: 1em; border: 2px solid currentColor; border-right-color: transparent; border-radius: 9999px; display: inline-block; animation: spin .7s linear infinite; vertical-align: -.15em; }
  @keyframes spin { to { transform: rotate(360deg); } }
  textarea.auto { overflow: hidden; resize: none; }
  #toast { bottom: calc(1.25rem + env(safe-area-inset-bottom)); }
</style>
</head>
<body class="min-h-screen bg-stone-100 text-stone-900 antialiased dark:bg-stone-950 dark:text-stone-100">
<main class="mx-auto max-w-3xl space-y-4 px-4 pb-16 pt-6">

  <header class="px-1">
    <h1 class="text-2xl font-black tracking-tight">鬼画符解码器 <span class="align-middle text-xl">👻</span></h1>
    <p class="mt-1 text-sm text-stone-500 dark:text-stone-400">手写图片批量识别 · 最多 10 张打包成 1 次请求 · 只扣 1 次额度</p>
  </header>

  <section class="rounded-2xl bg-white p-4 shadow-sm ring-1 ring-stone-200 dark:bg-stone-900 dark:ring-stone-800">
    <div class="mb-3 flex items-center justify-between">
      <h2 class="font-bold">① 钥匙与模型</h2>
      <div class="space-x-3 text-xs">
        <a class="text-red-700 hover:underline dark:text-red-400" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">去拿 Key</a>
        <a class="text-red-700 hover:underline dark:text-red-400" href="https://aistudio.google.com/rate-limit" target="_blank" rel="noopener">看额度</a>
      </div>
    </div>
    <div class="flex gap-2">
      <div class="relative min-w-0 flex-1">
        <input id="apiKey" type="text" class="masked w-full rounded-xl border border-stone-300 bg-stone-50 px-3 py-2.5 pr-11 text-base outline-none focus:border-red-600 dark:border-stone-700 dark:bg-stone-950" placeholder="粘贴 Google AI Studio 的 API Key" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button id="toggleKey" type="button" class="absolute inset-y-0 right-0 px-3 text-stone-400" aria-label="显示或隐藏 Key">👁</button>
      </div>
      <button id="saveKey" type="button" class="shrink-0 rounded-xl bg-stone-900 px-4 font-semibold text-white active:scale-95 dark:bg-stone-100 dark:text-stone-900">保存</button>
    </div>
    <div class="mt-2 flex items-center justify-between gap-2 text-xs text-stone-500 dark:text-stone-400">
      <span id="keyStatus">还没存 Key</span>
      <button id="clearKey" type="button" class="shrink-0 hover:text-red-600">清除 Key</button>
    </div>
    <div class="mt-3 flex gap-2">
      <select id="model" class="min-w-0 flex-1 rounded-xl border border-stone-300 bg-stone-50 px-3 py-2.5 text-base dark:border-stone-700 dark:bg-stone-950" aria-label="模型"></select>
      <button id="refreshModels" type="button" class="shrink-0 rounded-xl border border-stone-300 px-3.5 text-lg dark:border-stone-700" title="问谷歌要最新模型名单" aria-label="刷新模型名单"><span id="refreshIcon" class="inline-block">↻</span></button>
    </div>
    <p id="modelHint" class="mt-2 text-xs text-stone-500 dark:text-stone-400"></p>
  </section>

  <section class="rounded-2xl bg-white p-4 shadow-sm ring-1 ring-stone-200 dark:bg-stone-900 dark:ring-stone-800">
    <div class="mb-3 flex items-center justify-between">
      <h2 class="font-bold">② 上图 <span id="count" class="ml-1 text-sm font-normal text-stone-500 dark:text-stone-400">0/10</span></h2>
      <button id="clearAll" type="button" class="text-xs text-stone-500 hover:text-red-600 dark:text-stone-400" hidden>清空</button>
    </div>
    <label id="drop" for="fileInput" class="flex cursor-pointer select-none flex-col items-center justify-center rounded-xl border-2 border-dashed border-stone-300 px-4 py-7 text-center transition hover:border-red-600 dark:border-stone-700">
      <span class="text-3xl">📷</span>
      <span class="mt-2 font-semibold">点这里选图 / 拍照</span>
      <span class="mt-1 text-xs text-stone-500 dark:text-stone-400">电脑上也能直接拖进来，或者 Ctrl+V 粘贴截图 · 最多 10 张</span>
    </label>
    <input id="fileInput" type="file" accept="image/*" multiple class="sr-only">
    <div id="grid" class="mt-3 grid grid-cols-4 gap-2 empty:hidden sm:grid-cols-5"></div>
    <p id="sizeInfo" class="mt-2 text-xs text-stone-500 dark:text-stone-400"></p>
  </section>

  <section class="rounded-2xl bg-white p-4 shadow-sm ring-1 ring-stone-200 dark:bg-stone-900 dark:ring-stone-800">
    <h2 class="mb-3 font-bold">③ 开干</h2>
    <div class="grid grid-cols-2 gap-1 rounded-xl bg-stone-100 p-1 dark:bg-stone-800" role="tablist" aria-label="识别模式">
      <button type="button" data-mode="fields" role="tab">只抓手写</button>
      <button type="button" data-mode="text" role="tab">整页转写</button>
    </div>
    <p id="modeHint" class="mb-3 mt-2 text-xs text-stone-500 dark:text-stone-400"></p>
    <input id="extra" type="text" class="w-full rounded-xl border border-stone-300 bg-stone-50 px-3 py-2.5 text-base outline-none focus:border-red-600 dark:border-stone-700 dark:bg-stone-950" placeholder="附加要求（可选）：如「算出算式结果」「只提取金额」">
    <div class="mt-3 flex gap-2">
      <button id="run" type="button" class="flex-1 rounded-xl bg-red-700 px-4 py-3 text-base font-bold text-white shadow-sm active:scale-[.98] disabled:cursor-not-allowed disabled:opacity-40">开始识别</button>
      <button id="cancel" type="button" class="shrink-0 rounded-xl border border-stone-300 px-4 dark:border-stone-700" hidden>取消</button>
    </div>
    <div class="mt-2 flex items-start justify-between gap-3 text-xs text-stone-500 dark:text-stone-400">
      <span id="runStatus" class="min-w-0 break-words"></span>
      <span id="usage" class="shrink-0" title="按谷歌额度重置时间（美国太平洋时间零点）计"></span>
    </div>
  </section>

  <section id="resultsCard" class="rounded-2xl bg-white p-4 shadow-sm ring-1 ring-stone-200 dark:bg-stone-900 dark:ring-stone-800" hidden>
    <div class="mb-3 flex items-center justify-between gap-2">
      <h2 class="font-bold">④ 校对</h2>
      <span class="text-xs text-stone-500 dark:text-stone-400">点缩略图看大图 · 字可以直接改</span>
    </div>
    <div id="rows" class="space-y-4"></div>
  </section>

  <section id="exportCard" class="rounded-2xl bg-white p-4 shadow-sm ring-1 ring-stone-200 dark:bg-stone-900 dark:ring-stone-800" hidden>
    <div class="mb-3 flex items-center justify-between gap-2">
      <h2 class="font-bold">⑤ 带走</h2>
      <span class="text-xs text-stone-500 dark:text-stone-400">导出的是你改过之后的字</span>
    </div>
    <div class="grid grid-cols-2 gap-2 sm:grid-cols-3">
      <button type="button" data-exp="xlsx" class="rounded-xl border border-stone-300 py-2.5 text-sm font-semibold active:scale-95 disabled:opacity-50 dark:border-stone-700">Excel .xlsx</button>
      <button type="button" data-exp="csv" class="rounded-xl border border-stone-300 py-2.5 text-sm font-semibold active:scale-95 disabled:opacity-50 dark:border-stone-700">CSV .csv</button>
      <button type="button" data-exp="pdf" class="rounded-xl border border-stone-300 py-2.5 text-sm font-semibold active:scale-95 disabled:opacity-50 dark:border-stone-700">PDF .pdf</button>
      <button type="button" data-exp="doc" class="rounded-xl border border-stone-300 py-2.5 text-sm font-semibold active:scale-95 disabled:opacity-50 dark:border-stone-700">Word .doc</button>
      <button type="button" data-exp="md" class="rounded-xl border border-stone-300 py-2.5 text-sm font-semibold active:scale-95 disabled:opacity-50 dark:border-stone-700">Markdown .md</button>
      <button type="button" data-exp="txt" class="rounded-xl border border-stone-300 py-2.5 text-sm font-semibold active:scale-95 disabled:opacity-50 dark:border-stone-700">纯文本 .txt</button>
    </div>
    <button id="copyAll" type="button" class="mt-2 w-full rounded-xl bg-stone-900 py-3 font-bold text-white active:scale-[.98] dark:bg-stone-100 dark:text-stone-900">一键复制全部文本</button>
  </section>

  <footer class="space-y-1 px-1 pt-2 text-xs leading-relaxed text-stone-400 dark:text-stone-500">
    <p>考古守则：被划掉、涂黑的字按阵亡处理，本机不做招魂；认不出的一律画 □，不编、不猜、不替原作者背锅。</p>
    <p>字丑不在保修范围——AI 认不出的，原作者大概率自己也认不出。</p>
    <p>Key 只存在这台设备的浏览器里；图片和 Key 只发给谷歌，不经过任何别的服务器。</p>
  </footer>
</main>

<div id="toast" class="pointer-events-none fixed inset-x-0 z-50 flex justify-center px-4" hidden>
  <div id="toastMsg" class="max-w-md rounded-xl bg-stone-900/95 px-4 py-2.5 text-sm text-white shadow-lg dark:bg-stone-100/95 dark:text-stone-900"></div>
</div>
<div id="lightbox" class="fixed inset-0 z-40 flex items-center justify-center bg-black/90 p-3" hidden>
  <img id="lbImg" alt="原图" class="max-h-full max-w-full rounded-lg">
</div>

<script>
(() => {
'use strict';

const API = 'https://generativelanguage.googleapis.com/v1beta';
const LS = {
  key: 'gemini_ocr_api_key', model: 'gemini_ocr_model_v2', extra: 'gemini_ocr_extra',
  models: 'gemini_ocr_models', usage: 'gemini_ocr_usage', mode: 'gemini_ocr_mode'
};
// 长边 2048：整张 A4 表压到 1024 时中文小字只剩八九个像素，笔画糊掉
const MAX_IMAGES = 10, MAX_SIDE = 2048, JPEG_Q = 0.85, TIMEOUT_MS = 180000;
// 谷歌文档：2.5 系列只对以前用过的老用户开放，新项目用 3.5 Flash-Lite / 3.8 Flash
const DEFAULT_MODEL = 'gemini-3.5-flash-lite';
const PRESET_MODELS = [
  { id: 'gemini-3.5-flash-lite', tag: '新 Key 首选' },
  { id: 'gemini-3.8-flash', tag: '新 Key 可用' },
  { id: 'gemini-2.5-flash-lite' },
  { id: 'gemini-2.5-flash' },
  { id: 'gemini-2.5-pro' }
];

const PROMPT_FIELDS = [
  '你是手写填空提取器，只处理图片里用笔写上去的内容。',
  '规则：',
  '1. 只提取手写内容（笔写的字、数字、日期、时间、编号、签名、勾、叉）以及它所属的印刷标签；模板上其他印刷文字一律不输出。',
  '2. label 是手写内容前面（左边或上方）对应的印刷标签，照印刷原文抄；标签有中英双语时只写中文，没有中文才写英文。',
  '3. 表格里的手写，label 写成「行标题 · 列标题」，例如「1 工单资料 · 检查状态」。',
  '4. value 逐字照抄手写内容：数字、日期、时间、编号不改格式、不补全、不换算；看不清的字用 □；打勾写 √，打叉写 ×；被划掉作废的手写不输出。',
  '5. 没写东西的空格子直接跳过。',
  '6. 按阅读顺序排：从上到下，同一行从左到右。照片可能是横着或倒着拍的，先转正再读。',
  '7. 不要任何解释，只输出 JSON 数组：[{"index": 图片编号, "fields": [{"label": "标签", "value": "手写内容"}]}]；index 从 1 开始，与图片编号一一对应；某张没有手写就给空数组。'
].join('\n');
const PROMPT_TEXT = [
  '你是一台纯粹的手写 OCR 引擎，唯一任务是把图片里的文字原样转写出来。',
  '规则：',
  '1. 精准识别手写和印刷的文字、数字、标点、单位、数学符号与算式，按原样转写；不纠错、不补全、不翻译、不润色。',
  '2. 被横线划掉、涂黑、打叉作废的内容一律忽略，不输出。',
  '3. 保持原图的换行和段落；表格逐行输出，同一行的单元格之间用“ | ”分隔。',
  '4. 实在认不出的字用 □ 代替，不要猜；打勾写 √，打叉写 ×。',
  '5. 照片可能是横着或倒着拍的，先转正再读。',
  '6. 图里没有文字时，text 为空字符串。',
  '7. 不要任何解释、说明、寒暄，不要 Markdown 代码块。',
  '8. 只输出 JSON 数组，每张图一个对象：{"index": 图片编号, "text": "转写内容"}；index 从 1 开始，与图片编号一一对应，不遗漏、不合并、不重复。'
].join('\n');
const SCHEMA = {
  text: { type: 'ARRAY', items: { type: 'OBJECT', properties: { index: { type: 'INTEGER' }, text: { type: 'STRING' } }, required: ['index', 'text'] } },
  fields: {
    type: 'ARRAY',
    items: {
      type: 'OBJECT',
      properties: {
        index: { type: 'INTEGER' },
        fields: { type: 'ARRAY', items: { type: 'OBJECT', properties: { label: { type: 'STRING' }, value: { type: 'STRING' } }, required: ['label', 'value'] } }
      },
      required: ['index', 'fields']
    }
  }
};
const MODE_NAME = { fields: '只抓手写', text: '整页转写' };
const MODE_HINT = {
  fields: '只抓手写的内容和它前面的标签，一条一行，每条后面一个复制键，只复制手写的部分',
  text: '整页文字全部转写，保持原来的换行'
};

const $ = id => document.getElementById(id);
const state = { items: [], busy: false, ctrl: null, seq: 0 };
let mode = null;

/* ---------- small helpers ---------- */
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) { /* storage blocked */ } };
const tryJson = s => { try { return JSON.parse(s); } catch (e) { return undefined; } };
const escHtml = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const stamp = () => { const d = new Date(); return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`; };
const humanTime = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fname = ext => `鬼画符_${stamp()}.${ext}`;
const fmtKB = b => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
const byId = id => state.items.find(x => x.id === id);

let toastTimer = 0;
function toast(msg, ms = 2600) {
  $('toastMsg').textContent = msg;
  $('toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').hidden = true; }, ms);
}

async function copyText(t) {
  try {
    await navigator.clipboard.writeText(t);
    return true;
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    ta.remove();
    return ok;
  }
}
function flash(btn, ok) {
  if (!btn.dataset.label) btn.dataset.label = btn.textContent;
  btn.textContent = ok ? '✓ 已复制' : '复制失败';
  clearTimeout(btn._t);
  btn._t = setTimeout(() => { btn.textContent = btn.dataset.label; }, 1200);
}

/* ---------- API key ---------- */
const getKey = () => (lsGet(LS.key) || '').trim();
function renderKey() {
  const k = getKey();
  $('keyStatus').textContent = k ? `已保存（…${k.slice(-4)}），下次打开自动读取` : '还没存 Key';
  if (k && !$('apiKey').value) $('apiKey').value = k;
}
$('saveKey').addEventListener('click', () => {
  const k = $('apiKey').value.trim();
  if (!k) { toast('先把 Key 粘进框里'); return; }
  lsSet(LS.key, k);
  renderKey();
  toast(/^AIza[\w-]{30,}$/.test(k) ? 'Key 已存好' : 'Key 已存（格式有点怪，谷歌的 Key 一般是 AIza 开头）');
  loadModels({ silent: true });
});
$('apiKey').addEventListener('keydown', e => { if (e.key === 'Enter') $('saveKey').click(); });
$('toggleKey').addEventListener('click', () => $('apiKey').classList.toggle('masked'));
$('clearKey').addEventListener('click', () => {
  lsDel(LS.key);
  $('apiKey').value = '';
  renderKey();
  toast('Key 已从这台设备删掉');
});

/* ---------- mode ---------- */
const MODE_BASE = 'rounded-lg py-2 text-sm font-semibold transition ';
const MODE_ON = 'bg-white text-stone-900 shadow-sm dark:bg-stone-950 dark:text-white';
const MODE_OFF = 'text-stone-500 dark:text-stone-400';
function renderMode() {
  document.querySelectorAll('[data-mode]').forEach(b => {
    const on = b.dataset.mode === mode;
    b.className = MODE_BASE + (on ? MODE_ON : MODE_OFF);
    b.setAttribute('aria-selected', String(on));
  });
  $('modeHint').textContent = MODE_HINT[mode];
}
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
  if (state.busy) return;
  mode = b.dataset.mode;
  lsSet(LS.mode, mode);
  renderMode();
}));

/* ---------- Gemini calls（Key 只走 URL 参数 ?key=，不加任何自定义请求头） ---------- */
const modelName = m => String(m || '').trim().replace(/^models\//, '');
const keyParam = () => 'key=' + encodeURIComponent(getKey());

async function apiFetch(url, { method = 'POST', body, signal } = {}) {
  const init = { method, signal };
  if (body !== undefined) { init.headers = { 'Content-Type': 'application/json' }; init.body = JSON.stringify(body); }
  const res = await fetch(url, init);
  const raw = await res.text();
  const data = raw ? tryJson(raw) : {};
  if (!res.ok) {
    const err = new Error((data && data.error && data.error.message) || raw.slice(0, 500) || res.statusText || '（谷歌没给说明）');
    err.status = res.status;
    throw err;
  }
  if (data === undefined) throw new Error('返回的不是 JSON：' + raw.slice(0, 300));
  return data;
}

function genConfig(model, runMode) {
  const g = { temperature: 0.1, responseMimeType: 'application/json', responseSchema: SCHEMA[runMode] };
  if (/^gemini-2\.5-flash(?!-lite)/.test(model)) g.thinkingConfig = { thinkingBudget: 0 };
  return g;
}

function buildBody(list, extra, model, runMode) {
  const n = list.length;
  const job = runMode === 'fields' ? '逐张提取手写内容和它的标签。' : '逐张转写。';
  const parts = [{
    text: `下面共有 ${n} 张图片，按顺序编号 1 到 ${n}，每张图前面有编号标签。${job}` +
      (extra ? `\n附加要求（照做，结果写进对应图片的结果里）：${extra}` : '')
  }];
  list.forEach((it, i) => {
    parts.push({ text: `【图片 ${i + 1}】` });
    parts.push({ inline_data: { mime_type: 'image/jpeg', data: it.b64 } });
  });
  parts.push({
    text: runMode === 'fields'
      ? `只输出 JSON 数组 [{"index":1,"fields":[{"label":"...","value":"..."}]}]，index 从 1 到 ${n} 各出现一次；没有手写的图给空数组。`
      : `只输出 JSON 数组 [{"index":1,"text":"..."}]，index 从 1 到 ${n} 各出现一次。`
  });
  return {
    systemInstruction: { parts: [{ text: runMode === 'fields' ? PROMPT_FIELDS : PROMPT_TEXT }] },
    contents: [{ role: 'user', parts }],
    generationConfig: genConfig(model, runMode)
  };
}

function callModel(model, list, extra, runMode, signal) {
  const name = modelName(model);
  return apiFetch(`${API}/models/${name}:generateContent?${keyParam()}`, { body: buildBody(list, extra, name, runMode), signal });
}

function readResponse(data) {
  const c = data && data.candidates && data.candidates[0];
  if (!c) {
    const br = data && data.promptFeedback && data.promptFeedback.blockReason;
    throw new Error(br ? `promptFeedback.blockReason = ${br}` : '返回里没有 candidates：' + JSON.stringify(data).slice(0, 300));
  }
  const txt = ((c.content && c.content.parts) || []).filter(p => typeof p.text === 'string' && !p.thought).map(p => p.text).join('');
  const u = data.usageMetadata;
  return { txt, finish: c.finishReason, tokens: u && u.totalTokenCount };
}

function parseLoose(txt) {
  if (!txt) return undefined;
  const t = txt.trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
  let v = tryJson(t);
  if (v === undefined) {
    const s = t.indexOf('['), e = t.lastIndexOf(']');
    if (s >= 0 && e > s) v = tryJson(t.slice(s, e + 1));
  }
  return v;
}

// 按 index 把结果放回对应图片；index 缺失或重复时按顺序补位
function placeByIndex(v, n, pick) {
  const idxs = v.map(o => (o && typeof o === 'object') ? Number(o.index) : NaN);
  const zeroBased = idxs.includes(0) && !idxs.includes(n);
  const out = new Array(n).fill(null);
  v.forEach((o, i) => {
    if (o == null) return;
    const val = pick(o);
    let idx = Number.isInteger(idxs[i]) ? idxs[i] + (zeroBased ? 1 : 0) : NaN;
    if (!(idx >= 1 && idx <= n) || out[idx - 1] !== null) idx = (i < n && out[i] === null) ? i + 1 : out.indexOf(null) + 1;
    if (idx >= 1) out[idx - 1] = val;
  });
  return out;
}

function parseText(txt, n) {
  let v = parseLoose(txt);
  if (v && !Array.isArray(v) && typeof v === 'object') v = Object.values(v).find(Array.isArray) || ('text' in v ? [v] : undefined);
  if (!Array.isArray(v)) return null;
  return placeByIndex(v, n, o => typeof o === 'string' ? o : String(o.text ?? o.content ?? o.result ?? ''));
}

const cleanFields = arr => (Array.isArray(arr) ? arr : [])
  .map(f => (f && typeof f === 'object') ? {
    label: String(f.label ?? f.key ?? f.name ?? '').trim(),
    value: String(f.value ?? f.text ?? '').replace(/\r\n/g, '\n').trim()
  } : null)
  .filter(f => f && (f.label || f.value));

function parseFields(txt, n) {
  let v = parseLoose(txt);
  if (v && !Array.isArray(v) && typeof v === 'object') v = Object.values(v).find(Array.isArray) || ('fields' in v ? [v] : undefined);
  if (!Array.isArray(v)) return null;
  // 只有一张图时模型偶尔直接回 [{label,value}]：包一层
  if (v.length && v.every(o => o && typeof o === 'object' && !('fields' in o) && ('label' in o || 'value' in o))) v = [{ index: 1, fields: v }];
  return placeByIndex(v, n, o => cleanFields(o.fields));
}

function finishNote(f) {
  return `finishReason = ${f}` + (({
    MAX_TOKENS: '（输出到顶被截断，最后几张可能不全）',
    SAFETY: '（被谷歌安全过滤拦了）',
    RECITATION: '（被谷歌版权检测拦了）'
  })[f] || '') + '。';
}

// 报错原样显示：HTTP 状态码 + 谷歌返回的 error.message，不做任何翻译和改写
function rawError(e) {
  if (!e) return '未知错误';
  if (e.name === 'AbortError') return 'AbortError：已取消，或超过 3 分钟没有响应';
  if (e.status) return `HTTP ${e.status}：${e.message}`;
  return `${e.name || 'Error'}：${e.message || e}`;
}

/* ---------- model list ---------- */
function rankModels(models) {
  const BAD = /(image|tts|audio|live|native|embed|computer|robotics|aqa|learnlm|omni|veo|imagen|banana)/i;
  const out = [];
  for (const m of models || []) {
    const id = modelName(m.name);
    if (!/^gemini-/.test(id) || !/flash/.test(id) || BAD.test(id)) continue;
    if (!(m.supportedGenerationMethods || []).includes('generateContent')) continue;
    const vm = /^gemini-(\d+)(?:\.(\d+))?/.exec(id);
    out.push({
      id,
      lite: /lite/.test(id),
      alias: /-latest$/.test(id),
      pre: /(preview|exp)/.test(id),
      pinned: /-\d{3}$|-\d{2}-\d{4}$/.test(id),
      ver: vm ? (+vm[1]) * 100 + (+(vm[2] || 0)) : 0
    });
  }
  out.sort((a, b) => (b.lite - a.lite) || (a.alias - b.alias) || (a.pre - b.pre) || (b.ver - a.ver) || (a.pinned - b.pinned) || a.id.localeCompare(b.id));
  return out;
}

function fillModels(live, note) {
  const sel = $('model');
  const presetIds = PRESET_MODELS.map(m => m.id);
  const more = (live || []).filter(m => m && m.id && !presetIds.includes(m.id));
  const opt = (id, tag) => `<option value="${escHtml(id)}">${escHtml(id)}${tag ? '（' + escHtml(tag) + '）' : ''}</option>`;
  sel.innerHTML =
    `<optgroup label="预置（不用刷新，直接能选）">${PRESET_MODELS.map(m => opt(m.id, m.tag)).join('')}</optgroup>` +
    (more.length ? `<optgroup label="谷歌实时名单">${more.map(m => opt(m.id, m.alias ? '自动跟最新' : m.pre ? '预览版' : '')).join('')}</optgroup>` : '');
  const ids = presetIds.concat(more.map(m => m.id));
  const saved = lsGet(LS.model);
  sel.value = (saved && ids.includes(saved)) ? saved : DEFAULT_MODEL;
  $('modelHint').textContent = note || '';
}

async function loadModels({ silent = false } = {}) {
  if (!getKey()) return false;
  const btn = $('refreshModels');
  btn.disabled = true;
  $('refreshIcon').classList.add('animate-spin');
  try {
    let all = [], token = '', guard = 0;
    do {
      const data = await apiFetch(`${API}/models?${keyParam()}${token ? '&pageToken=' + encodeURIComponent(token) : ''}`, { method: 'GET' });
      all = all.concat(data.models || []);
      token = data.nextPageToken || '';
    } while (token && ++guard < 10);
    const list = rankModels(all);
    lsSet(LS.models, JSON.stringify({ t: Date.now(), list }));
    fillModels(list, `谷歌实时名单已拉到 · 共 ${list.length} 个 Flash 系 · ${humanTime().slice(11)}`);
    if (!silent) toast('模型名单已更新');
    return true;
  } catch (e) {
    const msg = rawError(e);
    $('modelHint').textContent = '实时名单没拉到：' + msg;
    if (!silent) toast('实时名单没拉到：' + msg, 8000);
    return false;
  } finally {
    btn.disabled = false;
    $('refreshIcon').classList.remove('animate-spin');
  }
}

/* ---------- images ---------- */
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({ img, url });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src = url;
  });
}

async function compress(file) {
  const { img, url } = await loadImage(file);
  try {
    const w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h) throw new Error('empty');
    const s = Math.min(1, MAX_SIDE / Math.max(w, h));
    const tw = Math.max(1, Math.round(w * s)), th = Math.max(1, Math.round(h * s));
    const cv = document.createElement('canvas');
    cv.width = tw; cv.height = th;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; // 透明 PNG 转 JPEG 不垫白底会变黑
    ctx.fillRect(0, 0, tw, th);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, tw, th);
    const dataUrl = cv.toDataURL('image/jpeg', JPEG_Q);
    const b64 = dataUrl.slice(dataUrl.indexOf(',') + 1);
    return { dataUrl, b64, w: tw, h: th, bytes: Math.round(b64.length * 3 / 4) };
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function addFiles(files) {
  if (state.busy) { toast('识别中，等这一轮完了再加'); return; }
  const imgs = files.filter(f => f && (/^image\//.test(f.type) || /\.(jpe?g|png|webp|gif|bmp|heic|heif|avif)$/i.test(f.name || '')));
  if (!imgs.length) { toast('没认出图片文件'); return; }
  const room = MAX_IMAGES - state.items.length;
  if (room <= 0) { toast(`满了，最多 ${MAX_IMAGES} 张`); return; }
  if (imgs.length > room) toast(`最多 ${MAX_IMAGES} 张，多出的 ${imgs.length - room} 张没收`);
  let bad = 0;
  for (const f of imgs.slice(0, room)) {
    try {
      const c = await compress(f);
      state.items.push({ id: 'i' + (++state.seq), name: f.name || `图片${state.seq}.jpg`, orig: f.size || 0, ...c, mode: 'text', text: '', fields: [], done: false });
      renderGrid();
    } catch (e) { bad++; }
  }
  if (bad) toast(`${bad} 张图解不开（可能是 HEIC 这类浏览器不认识的格式），跳过了`, 4000);
  renderAll();
}

document.addEventListener('paste', e => {
  const items = (e.clipboardData && e.clipboardData.items) || [];
  const files = [];
  for (const it of items) {
    if (it.kind !== 'file' || !/^image\//.test(it.type)) continue;
    const f = it.getAsFile();
    if (!f) continue;
    const d = new Date();
    const ext = (it.type.split('/')[1] || 'png').replace('jpeg', 'jpg');
    files.push(new File([f], f.name && f.name !== 'image.png' ? f.name : `截图_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}_${files.length + 1}.${ext}`, { type: f.type }));
  }
  if (files.length) { e.preventDefault(); addFiles(files); }
});

/* ---------- run ---------- */
function updateRun() {
  const n = state.items.length, b = $('run');
  b.disabled = state.busy || !n;
  if (!state.busy) b.textContent = n ? `开始识别（${n} 张 · 1 次请求）` : '开始识别';
  document.querySelectorAll('[data-redo]').forEach(x => { x.disabled = state.busy; });
}

const pacificDay = () => { try { return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Los_Angeles' }).format(new Date()); } catch (e) { return new Date().toISOString().slice(0, 10); } };
function getUsage() { const u = tryJson(lsGet(LS.usage) || '{}') || {}; return u.d === pacificDay() ? (u.n || 0) : 0; }
function bumpUsage() { lsSet(LS.usage, JSON.stringify({ d: pacificDay(), n: getUsage() + 1 })); renderUsage(); }
function renderUsage() { const n = getUsage(); $('usage').textContent = n ? `今日本机已用 ${n} 次` : ''; }

async function run(ids) {
  if (state.busy) return;
  if (!getKey()) { toast('先在 ① 里填 Key 并保存'); $('apiKey').focus(); return; }
  const list = ids ? state.items.filter(x => ids.includes(x.id)) : state.items.slice();
  if (!list.length) { toast('先上图'); return; }
  const extra = $('extra').value.trim();
  lsSet(LS.extra, extra);
  const model = modelName($('model').value || DEFAULT_MODEL);
  const runMode = mode;
  const ctrl = new AbortController();
  state.busy = true;
  state.ctrl = ctrl;
  updateRun();
  $('cancel').hidden = false;
  $('runStatus').textContent = '';
  $('runStatus').className = 'min-w-0 break-words';
  const t0 = performance.now();
  const tick = setInterval(() => { $('run').innerHTML = `<span class="spin"></span> 识别中 ${list.length} 张 · ${((performance.now() - t0) / 1000).toFixed(1)}s`; }, 100);
  const killer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  let note = '', extraInfo = '';
  try {
    const data = await callModel(model, list, extra, runMode, ctrl.signal);
    bumpUsage();
    const { txt, finish, tokens } = readResponse(data);
    if (runMode === 'fields') {
      const res = parseFields(txt, list.length);
      if (res) {
        list.forEach((it, i) => { it.mode = 'fields'; it.fields = res[i] || []; it.done = true; });
        const miss = res.filter(x => x === null).length;
        if (miss) note += `有 ${miss} 张模型漏了，可以点那张的「↻ 重识」。`;
        extraInfo = ` · 共 ${list.reduce((s, it) => s + it.fields.length, 0)} 条手写`;
      } else {
        list.forEach(it => { it.mode = 'fields'; it.fields = []; it.done = true; });
        list[0].mode = 'text';
        list[0].text = txt || '';
        note += '模型没按格式回，原文整个塞在第 1 张里了。';
      }
    } else {
      const res = parseText(txt, list.length);
      if (res) {
        list.forEach((it, i) => { it.mode = 'text'; it.text = (res[i] == null ? '' : res[i]).replace(/\r\n/g, '\n').replace(/\s+$/, ''); it.done = true; });
        const miss = res.filter(x => x === null).length;
        if (miss) note += `有 ${miss} 张模型漏写了，可以点那张的「单张重识」。`;
      } else {
        list.forEach(it => { it.mode = 'text'; it.done = true; });
        list[0].text = txt || '';
        note += '模型没按格式回，原文整个塞在第 1 格了。';
      }
    }
    if (finish && finish !== 'STOP') note += finishNote(finish);
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    $('runStatus').textContent = `✓ ${list.length} 张 · 1 次请求 · ${secs}s · ${model} · ${MODE_NAME[runMode]}${extraInfo}${tokens ? ` · ${tokens} tokens` : ''}`;
    if (note) toast(note, 5000);
    renderAll();
    if (!ids) $('resultsCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    const msg = rawError(e);
    $('runStatus').textContent = `✗ ${model} · ${msg}`;
    $('runStatus').className = 'min-w-0 break-words text-red-600 dark:text-red-400';
    toast(msg, 8000);
  } finally {
    clearInterval(tick);
    clearTimeout(killer);
    state.busy = false;
    state.ctrl = null;
    $('cancel').hidden = true;
    updateRun();
  }
}
$('run').addEventListener('click', () => run());
$('cancel').addEventListener('click', () => { if (state.ctrl) state.ctrl.abort(); });
$('extra').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) run(); });

/* ---------- export ---------- */
function collect() {
  $('rows').querySelectorAll('textarea[data-id]').forEach(ta => { const it = byId(ta.dataset.id); if (it) it.text = ta.value; });
  $('rows').querySelectorAll('textarea[data-fid]').forEach(ta => { const b = fieldBox(ta.dataset.fid); if (b) b.f.value = ta.value; });
  return state.items.map((it, i) => ({
    n: i + 1, name: it.name, fieldsMode: isFields(it),
    text: it.text || '', fields: (it.fields || []).map(f => ({ label: f.label, value: f.value }))
  }));
}
const anyFields = rows => rows.some(r => r.fieldsMode);
// 一行一条：[序号, 图片文件名, 标签, 内容]
const flatRows = rows => rows.flatMap(r => r.fieldsMode
  ? (r.fields.length ? r.fields.map(f => [r.n, r.name, f.label, f.value]) : [[r.n, r.name, '', '']])
  : [[r.n, r.name, '', r.text]]);
const tableOf = rows => anyFields(rows)
  ? { head: ['序号', '图片文件名', '标签', '手写内容'], body: flatRows(rows), cols: [{ wch: 6 }, { wch: 24 }, { wch: 30 }, { wch: 40 }] }
  : { head: ['序号', '图片文件名', '识别内容'], body: rows.map(r => [r.n, r.name, r.text]), cols: [{ wch: 6 }, { wch: 28 }, { wch: 80 }] };

function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

const plainText = rows => rows.map(r => `【${r.n}】${r.name}\n` + (r.fieldsMode ? r.fields.map(f => `${f.label}：${f.value}`).join('\n') : r.text)).join('\n\n') + '\n';

const PDF_BASE = 'background:#fff;color:#111;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:13px;line-height:1.7;';

async function exportPdf(rows) {
  if (!window.html2pdf) throw new Error('PDF 组件还没加载好，过几秒再点，或者刷新页面');
  const MM = 96 / 25.4, margin = [12, 12, 14, 12];
  const innerW = Math.floor((210 - margin[1] - margin[3]) * MM);
  const pageH = (297 - margin[0] - margin[2]) * MM;
  const head = `<div class="pl" style="font-size:20px;font-weight:800;margin-bottom:2px">识别结果</div>` +
    `<div class="pl" style="font-size:11px;color:#666;margin-bottom:14px">${humanTime()} · 共 ${rows.length} 张</div>`;
  const lineDiv = l => `<div class="pl" style="white-space:pre-wrap;word-break:break-word;min-height:1.7em">${escHtml(l) || '&nbsp;'}</div>`;
  const body = r => r.fieldsMode
    ? (r.fields.length
      ? r.fields.map(f => `<div class="pl" style="display:flex;gap:10px"><div style="width:42%;color:#666">${escHtml(f.label)}</div><div style="flex:1;font-weight:700;white-space:pre-wrap;word-break:break-word">${escHtml(f.value) || '&nbsp;'}</div></div>`).join('')
      : lineDiv('（没有手写）'))
    : (r.text || '（空）').split('\n').map(lineDiv).join('');
  const block = r => `<div style="margin:0 0 14px 0">` +
    `<div class="pl" style="font-weight:700;font-size:14px;border-bottom:1px solid #bbb;padding-bottom:3px;margin-bottom:6px">${r.n}. ${escHtml(r.name)}</div>` +
    body(r) + `</div>`;
  // 先量高度，再按约 5 页一段切块：整篇画成一张超长画布，手机 Safari 会直接画崩
  const probe = document.createElement('div');
  probe.style.cssText = `position:fixed;left:-99999px;top:0;width:${innerW}px;${PDF_BASE}`;
  document.body.appendChild(probe);
  probe.innerHTML = head;
  const headH = probe.offsetHeight;
  const heights = rows.map(r => { probe.innerHTML = block(r); return probe.offsetHeight; });
  probe.remove();
  const LIMIT = pageH * 5, chunks = [];
  let cur = { html: head, h: headH, n: 0 };
  rows.forEach((r, i) => {
    if (cur.n && cur.h + heights[i] > LIMIT) { chunks.push(cur); cur = { html: '', h: 0, n: 0 }; }
    cur.html += block(r); cur.h += heights[i]; cur.n++;
  });
  chunks.push(cur);
  const mk = html => { const d = document.createElement('div'); d.style.cssText = PDF_BASE; d.innerHTML = html; return d; };
  const opt = h => ({
    margin, filename: fname('pdf'),
    image: { type: 'jpeg', quality: 0.85 },
    html2canvas: { scale: Math.max(0.75, Math.min(2, Math.sqrt(14e6 / (innerW * Math.max(h, 1))))), backgroundColor: '#ffffff', useCORS: true, logging: false },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['css', 'legacy'], avoid: '.pl' }
  });
  let w = html2pdf().set(opt(chunks[0].h)).from(mk(chunks[0].html)).toPdf();
  for (const c of chunks.slice(1)) {
    w = w.get('pdf').then(pdf => { pdf.addPage(); }).set(opt(c.h)).from(mk(c.html)).toContainer().toCanvas().toPdf();
  }
  await w.save();
}

const mdCell = s => String(s == null ? '' : s).replace(/\|/g, '\\|').replace(/\n/g, '<br>');

const EXPORTERS = {
  xlsx(rows) {
    if (!window.XLSX) throw new Error('Excel 组件还没加载好，过几秒再点，或者刷新页面');
    const t = tableOf(rows);
    const ws = XLSX.utils.aoa_to_sheet([t.head, ...t.body]);
    ws['!cols'] = t.cols;
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '识别结果');
    XLSX.writeFile(wb, fname('xlsx'));
  },
  csv(rows) {
    const t = tableOf(rows);
    const cell = v => { const s = String(v == null ? '' : v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const body = [t.head, ...t.body].map(r => r.map(cell).join(',')).join('\r\n');
    download(new Blob(['﻿' + body + '\r\n'], { type: 'text/csv;charset=utf-8' }), fname('csv'));
  },
  pdf: exportPdf,
  doc(rows) {
    const t = tableOf(rows);
    const th = t.head.map((h, i) => `<th${i === 0 ? ' width="8%"' : ''}>${escHtml(h)}</th>`).join('');
    const trs = t.body.map(r => '<tr>' + r.map(v => `<td>${escHtml(v).replace(/\n/g, '<br>')}</td>`).join('') + '</tr>').join('');
    const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
      '<head><meta charset="utf-8"><title>识别结果</title>' +
      '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->' +
      '<style>body{font-family:"Microsoft YaHei","PingFang SC",SimSun,sans-serif;font-size:11pt}table{border-collapse:collapse;width:100%}th,td{border:1px solid #000;padding:4pt 6pt;vertical-align:top}th{background:#eeeeee}</style>' +
      `</head><body><h2>识别结果</h2><p style="color:#666;font-size:9pt">${humanTime()} · 共 ${rows.length} 张</p>` +
      `<table><tr>${th}</tr>${trs}</table></body></html>`;
    download(new Blob(['﻿' + html], { type: 'application/msword' }), fname('doc'));
  },
  md(rows) {
    const md = `# 识别结果\n\n> ${humanTime()} · 共 ${rows.length} 张\n\n` +
      rows.map(r => `## ${r.n}. ${r.name}\n\n` + (r.fieldsMode
        ? (r.fields.length ? '| 标签 | 手写内容 |\n| --- | --- |\n' + r.fields.map(f => `| ${mdCell(f.label)} | ${mdCell(f.value)} |`).join('\n') + '\n' : '（没有手写）\n')
        : `${(r.text || '（空）').split('\n').join('  \n')}\n`)).join('\n');
    download(new Blob([md], { type: 'text/markdown;charset=utf-8' }), fname('md'));
  },
  txt(rows) {
    download(new Blob([plainText(rows)], { type: 'text/plain;charset=utf-8' }), fname('txt'));
  }
};

$('exportCard').addEventListener('click', async e => {
  const b = e.target.closest('[data-exp]');
  if (!b || b.disabled) return;
  const rows = collect();
  if (!rows.length) { toast('没东西可导'); return; }
  const label = b.textContent;
  b.disabled = true;
  b.innerHTML = '<span class="spin"></span>';
  try {
    await EXPORTERS[b.dataset.exp](rows);
    toast(`${label} 已导出`);
  } catch (err) {
    toast('导出失败：' + (err && err.message ? err.message : err), 5000);
  } finally {
    b.disabled = false;
    b.textContent = label;
  }
});

// 手写模式只复制手写的值，一条一行；多张图之间空一行
$('copyAll').addEventListener('click', async () => {
  const rows = collect();
  const one = r => r.fieldsMode ? r.fields.map(f => f.value).join('\n') : r.text;
  const t = rows.length > 1 ? rows.map(r => `【${r.n}】\n${one(r)}`).join('\n\n') : (rows[0] ? one(rows[0]) : '');
  toast(await copyText(t) ? '已复制' : '复制没成功，长按文字手动复制吧');
});

/* ---------- boot ---------- */
function init() {
  mode = lsGet(LS.mode) === 'text' ? 'text' : 'fields';
  renderMode();
  renderKey();
  $('extra').value = lsGet(LS.extra) || '';
  const cached = tryJson(lsGet(LS.models) || 'null');
  fillModels(cached && Array.isArray(cached.list) ? cached.list : [], getKey() ? '预置模型直接能用；正在后台拉谷歌实时名单…' : '预置模型直接能用；存好 Key 后会再拉一份谷歌实时名单');
  renderUsage();
  renderAll();
  if (getKey()) loadModels({ silent: true });
}
init();
})();
</script>
